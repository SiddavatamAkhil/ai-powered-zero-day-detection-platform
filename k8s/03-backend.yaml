apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-artifacts
  namespace: zeroday-platform
spec:
  accessModes: ["ReadWriteMany"]
  resources: { requests: { storage: 20Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: zeroday-platform
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: zeroday-backend:latest  # replace with your registry path in CI
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: zeroday-config }
            - secretRef: { name: zeroday-secrets }
          volumeMounts:
            - name: model-artifacts
              mountPath: /data/model_artifacts
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { cpu: "2", memory: "4Gi" }
      volumes:
        - name: model-artifacts
          persistentVolumeClaim: { claimName: model-artifacts }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: zeroday-platform
spec:
  selector: { app: backend }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: zeroday-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
