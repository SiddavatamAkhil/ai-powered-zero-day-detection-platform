apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: zeroday-platform
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: zeroday-frontend:latest  # replace with your registry path in CI
          ports: [{ containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: zeroday-config }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: zeroday-platform
spec:
  selector: { app: frontend }
  ports: [{ port: 3000, targetPort: 3000 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zeroday-ingress
  namespace: zeroday-platform
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: zeroday.example.com  # replace with your actual domain
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service: { name: backend, port: { number: 8000 } }
          - path: /(.*)
            pathType: ImplementationSpecific
            backend:
              service: { name: frontend, port: { number: 3000 } }
