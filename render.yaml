services:
  - type: web
    name: ai-powered-zero-day-detection-platform
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        value: "https://zeroday-platform-frontend.onrender.com,http://localhost:3000"
      - key: PORT
        value: "8000"
      - key: POSTGRES_HOST
        value: postgres
      - key: POSTGRES_USER
        value: zeroday
      - key: POSTGRES_PASSWORD
        value: zeroday_pw
      - key: POSTGRES_DB
        value: zeroday_db

  - type: web
    name: zeroday-platform-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: "https://ai-powered-zero-day-detection-platform.onrender.com/api/v1"
      - key: PORT
        value: "10000"
