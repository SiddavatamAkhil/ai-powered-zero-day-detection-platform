services:
  - type: web
    name: ai-powered-zero-day-detection-platform
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        value: "https://zeroday-platform-frontend.onrender.com,http://localhost:3000"

  - type: web
    name: zeroday-platform-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    dockerBuildArgs:
      - key: NEXT_PUBLIC_API_URL
        value: "https://ai-powered-zero-day-detection-platform.onrender.com/api/v1"
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: "https://ai-powered-zero-day-detection-platform.onrender.com/api/v1"
