services:
  - type: web
    name: ai-powered-zero-day-detection-platform
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: BACKEND_CORS_ORIGINS
        value: '["https://zeroday-platform-frontend.onrender.com","http://localhost:3000","http://127.0.0.1:3000"]'
      - key: DATABASE_URL
        fromDatabase:
          name: zeroday-postgres
          property: connectionString
      - key: MONGO_URI
        value: ""
      - key: REDIS_URL
        value: ""
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: MODEL_ARTIFACT_DIR
        value: /tmp/model_artifacts
      - key: PROCESSED_DIR
        value: /tmp/processed
      - key: ADMIN_EMAIL
        value: "siddavatamakhil0204@gmail.com"
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_NAME
        value: "Admin"
      - key: MAX_UPLOAD_SIZE_MB
        value: "2048"
      - key: PYTHONPATH
        value: /app:/ml_pkg

  - type: web
    name: zeroday-platform-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: "https://ai-powered-zero-day-detection-platform.onrender.com/api/v1"
      - key: PORT
        value: "3000"

databases:
  - name: zeroday-postgres
    databaseName: zeroday_db
    user: zeroday
    plan: free
