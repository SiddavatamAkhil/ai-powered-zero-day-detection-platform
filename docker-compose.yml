services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zeroday
      POSTGRES_PASSWORD: zeroday_pw
      POSTGRES_DB: zeroday_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeroday -d zeroday_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile

    env_file:
      - ./backend/.env

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: zeroday
      POSTGRES_PASSWORD: zeroday_pw
      POSTGRES_DB: zeroday_db

      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: zeroday_docs

      REDIS_HOST: redis
      REDIS_PORT: "6379"

      UPLOAD_DIR: /data/uploads
      MODEL_ARTIFACT_DIR: /data/model_artifacts
      PYTHONPATH: /app:/ml_pkg

    volumes:
      - ./backend:/app
      - ./ml:/ml_pkg/ml
      - model_artifacts:/data/model_artifacts
      - uploads:/data/uploads

    ports:
      - "8080:10000"

    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1

    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
      PORT: 3000

    ports:
      - "3001:3000"

    depends_on:
      - backend

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  model_artifacts:
  uploads: